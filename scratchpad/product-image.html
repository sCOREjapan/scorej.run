<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:1200px; overflow:hidden; font-family:'Barlow', -apple-system, sans-serif; }
  .card {
    width:1200px; height:1200px; position:relative;
    background-image: url('../assets/illustrations/team-plan/hero_sprinter.png');
    background-size: cover; background-position: center 30%;
  }
  .overlay {
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(14,34,51,0.35) 0%, rgba(14,34,51,0.55) 45%, rgba(14,34,51,0.94) 78%, #0e2233 100%);
  }
  .content { position:absolute; inset:0; padding:80px 76px; display:flex; flex-direction:column; justify-content:flex-end; }
  .eyebrow {
    font-family:'Barlow', sans-serif; font-weight:700; font-size:26px; letter-spacing:3px;
    color:#f59e0b; text-transform:uppercase; margin-bottom:18px;
  }
  .badge {
    display:inline-flex; align-self:flex-start; background:#d97706; color:#fff;
    font-family:'Barlow', sans-serif; font-weight:700; font-size:22px;
    padding:8px 22px; border-radius:30px; margin-bottom:28px;
  }
  .planName {
    font-family:'Barlow Condensed', sans-serif; font-weight:800; font-size:104px;
    color:#fff; line-height:1.02; letter-spacing:0.5px;
  }
  .range { font-family:'Barlow', sans-serif; font-weight:600; font-size:30px; color:rgba(255,255,255,0.75); margin-top:14px; }
  .priceRow { display:flex; align-items:baseline; gap:14px; margin-top:36px; }
  .price { font-family:'Barlow Condensed', sans-serif; font-weight:800; font-size:96px; color:#fff; }
  .period { font-family:'Barlow', sans-serif; font-weight:600; font-size:32px; color:rgba(255,255,255,0.7); }
  .yearly { font-family:'Barlow', sans-serif; font-weight:600; font-size:26px; color:rgba(255,255,255,0.55); margin-top:6px; }
  .divider { width:100%; height:2px; background:rgba(255,255,255,0.18); margin:36px 0 30px; }
  .featRow { display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .dot { width:10px; height:10px; border-radius:5px; background:#22c55e; flex-shrink:0; }
  .featText { font-family:'Barlow', sans-serif; font-weight:600; font-size:28px; color:#fff; }
  .logo { position:absolute; top:76px; left:76px; display:flex; align-items:center; gap:14px; }
  .logoDot { width:22px; height:22px; border-radius:11px; background:#22c55e; }
  .logoText { font-family:'Barlow Condensed', sans-serif; font-weight:800; font-size:40px; color:#fff; letter-spacing:1px; }
  .logoText b { color:#f59e0b; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="overlay"></div>
    <div class="logo"><div class="logoDot"></div><div class="logoText">sCORE <b>Team</b></div></div>
    <div class="content">
      <div class="eyebrow">陸上競技チーム向け AIコーチングツール</div>
      <div class="badge" id="badge" style="display:none">人気</div>
      <div class="planName" id="planName">スタンダード</div>
      <div class="range" id="range">〜15人のチーム</div>
      <div class="priceRow">
        <div class="price" id="price">¥1,980</div>
        <div class="period">/月</div>
      </div>
      <div class="yearly" id="yearly">年払い ¥23,760（税込）</div>
      <div class="divider"></div>
      <div id="features"></div>
    </div>
  </div>

<script>
  const PLANS = {
    standard: {
      badge: false, name: 'スタンダード', range: '〜15人のチーム', price: '¥1,980', yearly: '年払い ¥23,760（税込）',
      features: ['AIフォーム分析（月次）', '怪我リスクスコア', 'チーム記録の一元管理'],
    },
    advance: {
      badge: true, name: 'アドバンス', range: '〜30人のチーム', price: '¥2,980', yearly: '年払い ¥35,760（税込）',
      features: ['スタンダードの全機能', '選手ごとのリスク推移グラフ', '練習メニューAI提案'],
    },
    premium: {
      badge: false, name: 'プレミアム', range: '人数無制限', price: '¥4,980', yearly: '年払い ¥59,760（税込）',
      features: ['アドバンスの全機能', 'チーム全体のリスク傾向レポート', '導入サポート面談'],
    },
  };
  const params = new URLSearchParams(location.search);
  const tier = params.get('tier') || 'standard';
  const p = PLANS[tier];
  document.getElementById('badge').style.display = p.badge ? 'inline-flex' : 'none';
  document.getElementById('planName').textContent = p.name;
  document.getElementById('range').textContent = p.range;
  document.getElementById('price').textContent = p.price;
  document.getElementById('yearly').textContent = p.yearly;
  document.getElementById('features').innerHTML = p.features.map(f =>
    `<div class="featRow"><div class="dot"></div><div class="featText">${f}</div></div>`
  ).join('');
</script>
</body>
</html>
